kind = "web"
previewPath = "/"
title = "ConnectSphere"
version = "1.0.0"
id = "artifacts/connectsphere"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20609

[services.development]
run = "pnpm --filter @workspace/connectsphere run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/connectsphere", "run", "build" ]
publicDir = "artifacts/connectsphere/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20609"
BASE_PATH = "/"
